# ─────────────────────────────────────────────────────────────────────────────
# htcondor.conf
# Environment configuration template for the MycoNote-CLI benchmark on HTCondor.
#
# Source this file before running submit_all.sh:
#     source configs/htcondor.conf
#     bash submit_all.sh
#
# Edit the paths below to match your cluster setup (GLBRC defaults shown).
# ─────────────────────────────────────────────────────────────────────────────

# ── Paths ────────────────────────────────────────────────────────────────
# Override these if you want data/results outside the benchmark directory,
# e.g. on /staging or /scratch where quotas are larger.
export BENCHMARK_DIR="${BENCHMARK_DIR:-$PWD}"
export DATA_DIR="${DATA_DIR:-$BENCHMARK_DIR/data}"
export RESULTS_DIR="${RESULTS_DIR:-$BENCHMARK_DIR/results}"

# On GLBRC, prefer /staging for large intermediate files:
# export DATA_DIR=/staging/$USER/myconote_bench/data
# export RESULTS_DIR=/staging/$USER/myconote_bench/results

# ── Conda ────────────────────────────────────────────────────────────────
# Path to the conda profile script that initialises `conda activate` inside
# worker nodes. Jobs source this before activating tool-specific envs.
export CONDA_PROFILE="${CONDA_PROFILE:-$HOME/miniconda3/etc/profile.d/conda.sh}"

# Environment names (must exist on all execute nodes or on shared storage)
export MYCONOTE_ENV="myconote"
export FUNANNOTATE_ENV="funannotate"
export MAKER_ENV="maker"
export BRAKER_ENV="braker"

# ── BRAKER / OrthoDB protein databases ───────────────────────────────────
# BRAKER in protein-only mode needs kingdom-specific OrthoDB FASTA files.
# Download from https://bioinf.uni-greifswald.de/bioinf/partitioned_odb11/
export ORTHODB_ROOT="${ORTHODB_ROOT:-/staging/braker/odb11}"

# ── MAKER external databases (optional, improves protein evidence) ────────
# Leave empty to run MAKER with genome-only input.
export MAKER_PROTEIN_EVIDENCE="${MAKER_PROTEIN_EVIDENCE:-}"
export MAKER_EST_EVIDENCE="${MAKER_EST_EVIDENCE:-}"

# ── MycoNote-CLI databases ───────────────────────────────────────────────
# Populated by `myconote-cli setup --all`. Re-use between runs to avoid
# re-downloading on every replicate.
export MYCONOTE_DB_DIR="${MYCONOTE_DB_DIR:-$HOME/.myconote/db}"

# ── HTCondor resource defaults ───────────────────────────────────────────
# Submit files read these to size their jobs. Override per-tool if you have
# a constrained queue.
export CONDOR_CPUS_MYCONOTE=8
export CONDOR_CPUS_FUNANNOTATE=8
export CONDOR_CPUS_MAKER=8
export CONDOR_CPUS_BRAKER=16

export CONDOR_MEM_MYCONOTE="16 GB"
export CONDOR_MEM_FUNANNOTATE="32 GB"
export CONDOR_MEM_MAKER="32 GB"
export CONDOR_MEM_BRAKER="64 GB"

# ── Notifications ────────────────────────────────────────────────────────
# Email address for HTCondor job-failure notifications. Edit per user.
export CONDOR_NOTIFY_USER="${CONDOR_NOTIFY_USER:-$USER@wisc.edu}"

# ── Sanity check ─────────────────────────────────────────────────────────
# Run after sourcing to confirm everything resolves:
#     echo "BENCHMARK_DIR=$BENCHMARK_DIR"
#     echo "DATA_DIR=$DATA_DIR"
#     echo "RESULTS_DIR=$RESULTS_DIR"
#     ls -d "$CONDA_PROFILE" && echo "conda profile OK"
