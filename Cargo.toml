[package]
name = "myconote-cli"
version = "0.7.4"
edition = "2021"
authors = ["Benjamin Narh-Madey <narhmadey@wisc.edu>"]
description = "High-performance fungal genome annotation pipeline — from raw assembly to NCBI-ready submission"
license = "MIT"
repository = "https://github.com/K-nie/myconote-cli"

[[bin]]
name = "myconote-cli"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow = "1.0"
thiserror = "1.0"
lazy_static = "1.4"


# Data structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
toml = "0.8"

# HTML templating — used by `compare --html` to render the interactive
# pan-genome report. tinytemplate is a small, runtime-evaluated
# templating crate (no compile-time codegen, no procedural macros).
# Picked over askama (compile-time) because we don't need type-safety
# benefits here and want the dep footprint smaller; over handlebars
# because handlebars pulls in regex + serde derives we don't need.
tinytemplate = "1.2"

# Parallel processing
rayon = "1.10"
crossbeam = "0.8"

# File handling
memmap2 = "0.9"
tempfile = "3.10"
walkdir = "2"
flate2 = "1.0"

# Parsing
nom = "7.1"
regex = "1.10"
bio = "2.0"

# Statistics
statrs = "0.17"
rand = "0.8"

# Plotting
plotters = "0.3.6"
plotters-svg = "0.3.6"
plotters-bitmap = "0.3.6"

# HTTP/API (for BLAST and annotation)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ureq = { version = "2.10", features = ["tls"] }
xml = "0.8"

# Progress bars
indicatif = "0.17"

# Binary execution (for external tools)
duct = "0.13"
which = "6.0"

# Hashing — used by src/quant/index.rs for the salmon index cache key
# (sha256 of cds_fa || genome_fa || salmon_version || k).
sha2 = "0.10"
# MD5 — used by src/fetch_rna/ena.rs to verify ENA-provided fastq_md5
# checksums after each download.
md-5 = "0.10"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3